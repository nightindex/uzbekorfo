name: Validation

on:
  push:
  pull_request:

jobs:
  preflight-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository preflight
        shell: pwsh
        run: ./eng/preflight.ps1
      - name: Validate generated dictionary artifact
        shell: pwsh
        run: ./eng/validate-dictionary-sync.ps1
      - name: Check Windows UI scaling and scrolling
        shell: pwsh
        run: ./eng/test-ui.ps1
      - name: Restore test dependencies
        run: dotnet restore ./tests/UzbekOrfoAddIn.UnitTests/UzbekOrfoAddIn.UnitTests.csproj
      - name: Run host-independent unit tests
        shell: pwsh
        run: ./eng/test-unit.ps1 -Configuration Release
